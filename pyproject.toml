[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alloy-forge"
version = "0.1.0"
description = "AI-assisted alloy design MVP built with PyTorch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "numpy>=2.0,<3",
  "torch>=2.5,<3",
  "reportlab>=4.2,<5",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
quantum = [
  "chgnet>=0.4,<1",
  "pymatgen>=2025.1",
  "ase>=3.24,<4",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

